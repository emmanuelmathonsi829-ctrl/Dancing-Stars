
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Fresh Fire Dancing Stars</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-header">

                <a href="index.html" class="logo">
                    <span>Fresh Fire</span>
                    <small>Dancing Stars</small>
                </a>

                <p class="login-label">
                    MEMBER LOGIN
                </p>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Sign in to access the Dancing Stars management system.
                </p>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button type="submit" id="loginButton">
                    Login
                </button>

                <p id="loginMessage" class="login-message"></p>

            </form>

            <a href="index.html" class="back-link">
                ← Back to website
            </a>

        </div>

    </main>

    <script src="js/login.js"></script>

</body>
</html>
